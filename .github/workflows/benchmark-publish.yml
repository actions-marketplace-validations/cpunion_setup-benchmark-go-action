name: Publish self benchmarks

on:
  workflow_run:
    workflows: [Go benchmarks]
    types: [completed]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/publish.yml
    with:
      run_id: ${{ github.event.workflow_run.id }}
